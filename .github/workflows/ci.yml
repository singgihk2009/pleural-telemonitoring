name: Bootstrap CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate:openapi
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm build:mobile
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: pleural_test
          MYSQL_USER: pleural
          MYSQL_PASSWORD: test_only
          MYSQL_ROOT_PASSWORD: root_test_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: pleural_test
      DB_USERNAME: pleural
      DB_PASSWORD: test_only
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, pdo_sqlite, dom, xml, zip
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: composer validate --strict
      - run: cp .env.example .env && php artisan key:generate
      - run: composer lint
      - run: composer test
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose up -d --build --wait --wait-timeout 600
      - run: |
          curl --fail http://127.0.0.1:8000/api/v1/health
          curl --fail http://127.0.0.1:5173
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes
