name: telenapas-synthetic-uat
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: telenapas_synthetic_uat_test
      MYSQL_USER: telenapas_uat
      MYSQL_PASSWORD: ${UAT_MYSQL_PASSWORD:?Set the isolated runtime password}
      MYSQL_ROOT_PASSWORD: ${UAT_MYSQL_ROOT_PASSWORD:?Set the isolated administrator password}
    ports:
      - "127.0.0.1:3338:3306"
    volumes:
      - uat_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u \"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
volumes:
  uat_mysql:
