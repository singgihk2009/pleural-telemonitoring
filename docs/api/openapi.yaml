    AccessGrantResponse:
      type: object
      additionalProperties: false
      required:
      - data
      properties:
        data:
          type: object
          additionalProperties: false
          required:
          - id
          - expires_at
          - scopes
          properties:
            id:
              type: integer
              minimum: 1
            expires_at:
              type: string
              format: date-time
            scopes:
              type: array
              minItems: 1
              maxItems: 3
              uniqueItems: true
              items:
                $ref: '#/components/schemas/AccessGrantScope'
    AccessGrantScope:
      type: string
      enum:
      - TECHNICAL
      - CONTACT
      - CLINICAL_READ
      description: Independent, explicitly approved scope. TECHNICAL grants no patient-resource reads;
        CONTACT permits contact only; CLINICAL_READ permits summary/list, monitoring and outcomes without
        contact. Existing role/blinding restrictions still apply.
    EnrollmentContact:
      type: object
      additionalProperties: false
      required: []
      properties:
        initials:
          oneOf:
          - type: string
            maxLength: 20
          - type: 'null'
        patient_contact:
          oneOf:
          - type: string
            maxLength: 40
          - type: 'null'
        family_contact:
          oneOf:
          - type: string
            maxLength: 40
          - type: 'null'
    EnrollmentCreate:
      type: object
      additionalProperties: false
      required:
      - kode
      - kelompok
      - tanggal_pulang
      - vas_baseline_mm
      - tanggal_consent
      - versi_consent
      properties:
        kode:
          type: string
          minLength: 1
          maxLength: 32
        kelompok:
          type: string
          enum:
          - INTERVENSI
          - KONTROL
        tanggal_pulang:
          type: string
          format: date
        vas_baseline_mm:
          type: integer
          minimum: 0
          maximum: 100
        tanggal_consent:
          type: string
          format: date
        versi_consent:
          type: string
          minLength: 1
          maxLength: 40
        status:
          type: string
          enum:
          - AKTIF
          - SELESAI
          - DROP_OUT
        alasan_drop_out:
          oneOf:
          - type: string
            maxLength: 1000
          - type: 'null'
        contact:
          oneOf:
          - $ref: '#/components/schemas/EnrollmentContact'
          - type: 'null'
      description: Researcher only. Status defaults to AKTIF. DROP_OUT requires a nonempty reason; other
        states require no reason. Creates no patient app credential. No clinical classification or alert
        is generated.
    EnrollmentUpdate:
      type: object
      additionalProperties: false
      required:
      - expected_updated_at
      properties:
        tanggal_pulang:
          type: string
          format: date
        vas_baseline_mm:
          type: integer
          minimum: 0
          maximum: 100
        tanggal_consent:
          type: string
          format: date
        versi_consent:
          type: string
          minLength: 1
          maxLength: 40
        status:
          type: string
          enum:
          - AKTIF
          - SELESAI
          - DROP_OUT
        alasan_drop_out:
          oneOf:
          - type: string
            maxLength: 1000
          - type: 'null'
        contact:
          oneOf:
          - $ref: '#/components/schemas/EnrollmentContact'
          - type: 'null'
        expected_updated_at:
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
      description: Partial update. Code/group are prohibited even if unchanged. Baseline and discharge
        date cannot change after any entry, alert, outcome or usability record. Consent/contact/status
        may still change. Use updated_at verbatim as the expected version, including null for a legacy
        null timestamp. Stale versions return 409. Non-active status revokes existing patient tokens.
    EnrollmentSummary:
      type: object
      additionalProperties: false
      required:
      - id
      - kode
      - kelompok
      - tanggal_pulang
      - vas_baseline_mm
      - tanggal_consent
      - versi_consent
      - status
      - updated_at
      properties:
        id:
          type: string
          format: uuid
        kode:
          type: string
          minLength: 1
          maxLength: 32
        kelompok:
          type: string
          enum:
          - INTERVENSI
          - KONTROL
        tanggal_pulang:
          type: string
          format: date
        vas_baseline_mm:
          type: integer
          minimum: 0
          maximum: 100
        tanggal_consent:
          type: string
          format: date
        versi_consent:
          type: string
          minLength: 1
          maxLength: 40
        status:
          type: string
          enum:
          - AKTIF
          - SELESAI
          - DROP_OUT
        updated_at:
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
    EnrollmentEditor:
      type: object
      additionalProperties: false
      required:
      - id
      - kode
      - kelompok
      - tanggal_pulang
      - vas_baseline_mm
      - tanggal_consent
      - versi_consent
      - status
      - updated_at
      - alasan_drop_out
      - baseline_locked
      - contact
      properties:
        id:
          type: string
          format: uuid
        kode:
          type: string
          minLength: 1
          maxLength: 32
        kelompok:
          type: string
          enum:
          - INTERVENSI
          - KONTROL
        tanggal_pulang:
          type: string
          format: date
        vas_baseline_mm:
          type: integer
          minimum: 0
          maximum: 100
        tanggal_consent:
          type: string
          format: date
        versi_consent:
          type: string
          minLength: 1
          maxLength: 40
        status:
          type: string
          enum:
          - AKTIF
          - SELESAI
          - DROP_OUT
        updated_at:
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
        alasan_drop_out:
          oneOf:
          - type: string
            maxLength: 1000
          - type: 'null'
        baseline_locked:
          type: boolean
        contact:
          oneOf:
          - $ref: '#/components/schemas/EnrollmentContact'
          - type: 'null'
    EnrollmentEditorResponse:
      type: object
      additionalProperties: false
      required:
      - data
      properties:
        data:
          $ref: '#/components/schemas/EnrollmentEditor'
    EnrollmentSearch:
      type: object
      additionalProperties: false
      required: []
      properties:
        search:
          oneOf:
          - type: string
            maxLength: 32
            description: Literal study-code substring, not a contact/name search. Sent in JSON rather
              than the URL.
          - type: 'null'
        group:
          oneOf:
          - type: string
            enum:
            - INTERVENSI
            - KONTROL
          - type: 'null'
        status:
          oneOf:
          - type: string
            enum:
            - AKTIF
            - SELESAI
            - DROP_OUT
          - type: 'null'
        page:
          type: integer
          minimum: 1
    EnrollmentPage:
      type: object
      additionalProperties: false
      required:
      - data
      - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/EnrollmentSummary'
        meta:
          type: object
          additionalProperties: false
          required:
          - current_page
          - last_page
          - total
          - intervensi
          - kontrol
          - aktif
          properties:
            current_page:
              type: integer
              minimum: 1
            last_page:
              type: integer
              minimum: 1
            total:
              type: integer
              minimum: 0
            intervensi:
              type: integer
              minimum: 0
            kontrol:
              type: integer
              minimum: 0
            aktif:
              type: integer
              minimum: 0
    EnrollmentAccessResponse:
      type: object
      additionalProperties: false
      required:
      - data
      properties:
        data:
          type: object
          additionalProperties: false
          required:
          - can_manage_enrollment
          properties:
            can_manage_enrollment:
              type: boolean
              const: true
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum personal access token
  responses:
    Unauthorized:
      description: Missing, expired, revoked or inactive-principal token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Role, participant scope, blinding or identified-access policy denies this action.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InvalidRequest:
      description: Invalid request fields; secret values are never returned.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyAttempts:
      description: Shared account/IP login limit reached. Retries do not disclose account existence.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      headers:
        Retry-After:
          description: Seconds before retrying.
          schema:
            type: integer
            minimum: 0
