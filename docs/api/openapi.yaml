          - type: 'null'
        kekambuhan_b:
          oneOf:
          - type: boolean
          - type: 'null'
        kekambuhan_c:
          oneOf:
          - type: boolean
          - type: 'null'
        kekambuhan_akhir:
          oneOf:
          - type: boolean
          - type: 'null'
        readmission:
          oneOf:
          - type: boolean
          - type: 'null'
    PageMeta:
      type: object
