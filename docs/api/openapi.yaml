openapi: 3.1.0
info:
  title: Pleural Telemonitoring Development API
  version: 0.5.0
  description: TeleNapas infrastructure health, separate staff/patient bearer authentication, and participant-scoped
    research access. No clinical engine or active notification delivery. PR-04 adds researcher-only enrollment
    and baseline management with encrypted optional contact data and optimistic updates.
servers:
- url: http://localhost:8000
  description: Local development API
security: []
tags:
- name: Health
  description: Infrastructure readiness
- name: Authentication
  description: Expiring Sanctum bearer tokens and revocation
- name: Participants
  description: Policy-scoped read projections; default blinded assessment
- name: Access management
  description: Researcher-issued credentials and separately authorized IT access
- name: Enrollment
  description: Researcher-only study enrollment, baseline and status management
- name: Assessments
  description: Approved-version patient daily submissions and policy-scoped immutable history; no classification
    or alerts
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      summary: Check API and database readiness
      description: Runs a read-only SELECT 1 against the configured database. Returns a sanitized 503
        response when the database query fails. No clinical data is read or written. Development browser
        access is restricted to http://localhost:5173 without credentials; CORS is not access control.
      tags:
      - Health
      responses:
        '200':
          description: The API and database are available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyHealth'
              example:
                status: ok
                database: connected
        '503':
          description: The database is unavailable; connection details are omitted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnavailableHealth'
              example:
                status: unavailable
                database: disconnected
  /api/v1/auth/staff/login:
    post:
      operationId: loginStaff
      summary: Authenticate a staff account
      description: Email/password login. At most 5 attempts per normalized account in 15 minutes and 30
        per IP per minute, persisted in MySQL. Generic failures. Token lifetime defaults to 60 minutes.
      tags:
      - Authentication
      security: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/InvalidRequest'
        '429':
          $ref: '#/components/responses/TooManyAttempts'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - email
              - password
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 190
                password:
                  type: string
                  format: password
                  maxLength: 72
  /api/v1/auth/patient/login:
    post:
      operationId: loginPatient
      summary: Authenticate an intervention participant
      description: Researcher-issued study code and exactly six ASCII digits as a string. Leading zeros
        are preserved. Same durable account/IP limits as staff, in a separate namespace. Controls never
        receive credentials.
      tags:
      - Authentication
      security: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/InvalidRequest'
        '429':
          $ref: '#/components/responses/TooManyAttempts'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - code
              - pin
              properties:
                code:
                  type: string
                  maxLength: 32
                pin:
                  type: string
                  format: password
                  pattern: ^[0-9]{6}$
                  minLength: 6
                  maxLength: 6
  /api/v1/auth/me:
    get:
      operationId: getIdentity
      summary: Read current authenticated identity
      description: Current database roles and principal kind; patient identities are separate from staff
        accounts.
      tags:
      - Authentication
      security: &id001
      - bearerAuth: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/auth/logout:
    post:
      operationId: logoutCurrentSession
      summary: Revoke the current bearer token
      description: Deletes the current token. Reuse is rejected. No cookie session is accepted.
      tags:
      - Authentication
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/auth/logout-all:
    post:
      operationId: logoutAllSessions
      summary: Revoke every token for the current principal
      description: Deletes all staff or patient tokens for the authenticated principal, serialized with
        login.
      tags:
      - Authentication
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/participants:
    get:
      operationId: listParticipants
      summary: List only authorized participant summaries
      description: Database scope applies before pagination and counts. Patients see themselves; nurses
        need active assignments; assessors/researchers see study summaries; IT needs an active participant-specific
        grant. ADMIN_IT requires CLINICAL_READ to appear in the scoped list or counts; TECHNICAL and CONTACT
        alone yield no participants.
      tags:
      - Participants
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipantSummaryPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      parameters:
      - name: page
        in: query
        description: Page number; page size is fixed at 25.
        schema:
          type: integer
          minimum: 1
  /api/v1/participants/{participant}:
    get:
      operationId: getParticipant
      summary: Read an authorized participant summary
      description: Blinded assessors do not receive group, study code or discharge date. Identity and
        monitoring data are never embedded. ADMIN_IT requires an explicit CLINICAL_READ grant because
        the summary contains baseline clinical data.
      tags:
      - Participants
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipantSummaryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - name: participant
        in: path
        required: true
        description: Opaque participant UUID. Every request is checked against current policy.
        schema:
          type: string
          format: uuid
  /api/v1/participants/{participant}/contact:
    get:
      operationId: getParticipantContact
      summary: Read participant contact
      description: Own patient, authorized assigned nurse, principal researcher, or separately authorized
        IT only. Assessors are always denied. Values are decrypted only after policy authorization. ADMIN_IT
        requires explicit CONTACT; neither TECHNICAL nor CLINICAL_READ implies contact permission. CONTACT
        alone does not grant a clinical summary or list entry.
      tags:
      - Participants
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - name: participant
        in: path
        required: true
        description: Opaque participant UUID. Every request is checked against current policy.
        schema:
          type: string
          format: uuid
  /api/v1/participants/{participant}/entries:
    get:
      operationId: getParticipantEntries
      summary: Read participant entries
      description: Participant monitoring read. Blinded assessors are denied even if they hold another
        role. ADMIN_IT requires explicit CLINICAL_READ. Neither TECHNICAL nor CONTACT implies clinical
        access. Policies and database query scopes both enforce this boundary.
      tags:
      - Participants
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntryPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - name: participant
        in: path
        required: true
        description: Opaque participant UUID. Every request is checked against current policy.
        schema:
          type: string
          format: uuid
      - name: page
        in: query
        description: Page number; page size is fixed at 25.
        schema:
          type: integer
          minimum: 1
  /api/v1/participants/{participant}/classifications:
    get:
      operationId: getParticipantClassifications
      summary: Read participant classifications
      description: Stored classification history only. No classification is computed. Blinded assessors
        are denied. ADMIN_IT requires explicit CLINICAL_READ. Neither TECHNICAL nor CONTACT implies clinical
        access. Policies and database query scopes both enforce this boundary.
      tags:
      - Participants
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassificationPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - name: participant
        in: path
        required: true
        description: Opaque participant UUID. Every request is checked against current policy.
        schema:
          type: string
          format: uuid
      - name: page
        in: query
        description: Page number; page size is fixed at 25.
        schema:
          type: integer
          minimum: 1
  /api/v1/participants/{participant}/alerts:
    get:
      operationId: getParticipantAlerts
      summary: Read participant alerts
      description: Staff monitoring read only; patients and blinded assessors are denied. ADMIN_IT requires
        explicit CLINICAL_READ. Neither TECHNICAL nor CONTACT implies clinical access. Policies and database
        query scopes both enforce this boundary.
      tags:
      - Participants
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - name: participant
        in: path
        required: true
        description: Opaque participant UUID. Every request is checked against current policy.
        schema:
          type: string
          format: uuid
      - name: page
        in: query
        description: Page number; page size is fixed at 25.
        schema:
          type: integer
          minimum: 1
  /api/v1/participants/{participant}/follow-ups:
    get:
      operationId: getParticipantFollowUps
      summary: Read participant follow-ups
      description: Authorized staff may read assessment notes; patients and blinded assessors are denied.
        ADMIN_IT requires explicit CLINICAL_READ. Neither TECHNICAL nor CONTACT implies clinical access.
        Policies and database query scopes both enforce this boundary.
      tags:
      - Participants
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FollowUpPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - name: participant
        in: path
        required: true
        description: Opaque participant UUID. Every request is checked against current policy.
        schema:
          type: string
          format: uuid
      - name: page
        in: query
        description: Page number; page size is fixed at 25.
        schema:
          type: integer
          minimum: 1
  /api/v1/participants/{participant}/outcome:
    get:
      operationId: getParticipantOutcome
      summary: Read participant outcome
      description: Outcome projection for an authorized participant in either group. No contact, hospital,
        monitoring relationship or outcome derivation is returned. ADMIN_IT requires explicit CLINICAL_READ.
        Neither TECHNICAL nor CONTACT implies clinical access. Policies and database query scopes both
        enforce this boundary.
      tags:
      - Participants
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutcomeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - name: participant
        in: path
        required: true
        description: Opaque participant UUID. Every request is checked against current policy.
        schema:
          type: string
          format: uuid
  /api/v1/participants/{participant}/credentials:
    get:
      operationId: getPatientCredentialStatus
      summary: Read a consistent credential status and non-secret revision
      description: Active principal researcher only for active intervention participants; IT and assessor
        combinations are always denied. One indexed snapshot read without an exclusive participant lock
        or successful-read audit insertion. Permission denials remain audited. No PIN, hash, token or
        issuer metadata is returned. The snapshot is not a promise against later authorized changes.
      tags:
      - Access management
      security:
      - bearerAuth: []
      parameters:
      - name: participant
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Non-cacheable status/revision snapshot. Null revision means no credential or a
            legacy row.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - data
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required:
                    - status
                    - revision
                    properties:
                      status:
                        type: string
                        enum:
                        - BELUM_DITERBITKAN
                        - AKTIF
                        - DICABUT
                      revision:
                        $ref: '#/components/schemas/CredentialRevision'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: issuePatientCredential
      summary: Issue or reset a PIN with an expected credential revision
      description: Principal researcher only, never IT or assessor combinations. Six ASCII digits as a
        string are hashed; plaintext and hashes are never returned. The required expected_revision must
        match the stored revision under the participant lock before any hash/token/audit mutation. Stale
        writes return 409 without changes. Successful reset requires a different PIN and revokes prior
        sessions. The receipt identifies the committed revision; compare it with a fresh active snapshot
        before disclosure. A lost or aborted browser response is not server cancellation.
      tags:
      - Access management
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - pin
              - expected_revision
              properties:
                pin:
                  type: string
                  format: password
                  pattern: ^[0-9]{6}$
                  minLength: 6
                  maxLength: 6
                expected_revision:
                  $ref: '#/components/schemas/CredentialRevision'
      parameters:
      - name: participant
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '201':
          description: Committed non-secret revision receipt; never a PIN or hash.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialMutationReceipt'
        '409':
          description: Stale revision; no mutation committed. Reload status and explicitly confirm a new
            operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: revokePatientCredential
      summary: Revoke Android access with an expected credential revision
      description: Same researcher/participant restrictions as issuance. The revision is checked under
        the participant lock; stale revocations return 409 before token deletion or audit mutation. A
        successful revocation invalidates sessions and preserves participant/research records.
      tags:
      - Access management
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - expected_revision
              properties:
                expected_revision:
                  $ref: '#/components/schemas/CredentialRevision'
      parameters:
      - name: participant
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Committed revocation revision receipt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialMutationReceipt'
        '409':
          description: Credential changed; no revocation committed. Reload status before confirming again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/staff/{staff}/tokens:
    delete:
      operationId: revokeStaffSessions
      summary: Revoke a staff account’s sessions
      description: ADMIN_IT technical account operation. Does not grant any clinical access.
      tags:
      - Access management
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - name: staff
        in: path
        required: true
        description: Staff account ID.
        schema:
          type: integer
          minimum: 1
  /api/v1/participants/{participant}/identified-access:
    post:
      operationId: grantIdentifiedAccess
      summary: Separately authorize time-limited IT access
      description: An active, non-blinded, non-IT principal researcher must explicitly select one or more
        scopes for another active ADMIN_IT account and one participant. Scopes are independent; none is
        inferred from another. TECHNICAL permits no patient resources; CONTACT permits contact only; CLINICAL_READ
        permits summaries, monitoring and outcomes, not contacts. No self-approval, role-combination bypass,
        or assessor-blinding override. Expiry is mandatory and no later than the configured maximum (default
        24 hours). Missing/empty/unknown/duplicate scopes are rejected. Legacy unscoped grants authorize
        no data.
      tags:
      - Access management
      security:
      - bearerAuth: []
      responses:
        '201':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessGrantResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/NotFound'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - staff_id
              - purpose_code
              - expires_at
              - scopes
              properties:
                staff_id:
                  type: integer
                  minimum: 1
                purpose_code:
                  type: string
                  pattern: ^[A-Z0-9_]{1,80}$
                expires_at:
                  type: string
                  format: date-time
                scopes:
                  type: array
                  minItems: 1
                  maxItems: 3
                  uniqueItems: true
                  items:
                    $ref: '#/components/schemas/AccessGrantScope'
      parameters:
      - name: participant
        in: path
        required: true
        description: Opaque participant UUID. Every request is checked against current policy.
        schema:
          type: string
          format: uuid
  /api/v1/participants/{participant}/identified-access/{grant}:
    delete:
      operationId: revokeIdentifiedAccess
      summary: Revoke a separate IT access grant
      description: Principal researcher only. Effective on the next request. Expiry, approver deactivation
        or researcher-role loss also invalidates the grant.
      tags:
      - Access management
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - name: participant
        in: path
        required: true
        description: Opaque participant UUID. Every request is checked against current policy.
        schema:
          type: string
          format: uuid
      - name: grant
        in: path
        required: true
        description: Access grant ID within this participant.
        schema:
          type: integer
          minimum: 1
  /api/v1/research/access:
    get:
      operationId: getEnrollmentAccess
      summary: Check researcher enrollment access
      description: Active PENELITI_UTAMA only; ADMIN_IT and all PENILAI_HASIL combinations remain denied,
        regardless of blinding. No patient data returned.
      tags:
      - Enrollment
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentAccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: Storage unavailable; SQL, request payload and bindings are not disclosed or logged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/research/participants/search:
    post:
      operationId: searchResearchParticipants
      summary: Search enrolled research participants
      description: Researcher-only paginated list. Study-code search is a literal substring in the JSON
        body, never a URL query. Group/status filters and all four counts apply to the same filtered set
        before pagination. Page size is 25. No contacts or drop-out reasons are embedded.
      tags:
      - Enrollment
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: Storage unavailable; SQL, request payload and bindings are not disclosed or logged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/InvalidRequest'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollmentSearch'
  /api/v1/research/participants:
    post:
      operationId: enrollResearchParticipant
      summary: Enroll a research participant
      description: Atomically create pseudonymous study data, optional encrypted contact data and an immutable
        audit event. Neither group receives app credentials automatically; control credentials remain
        prohibited by the existing schema. Audit events contain no participant ID/code, dates, contacts,
        clinical values or reasons.
      tags:
      - Enrollment
      security:
      - bearerAuth: []
      responses:
        '201':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentEditorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: Storage unavailable; SQL, request payload and bindings are not disclosed or logged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/InvalidRequest'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollmentCreate'
  /api/v1/research/participants/{participant}:
    get:
      operationId: getEnrollmentEditor
      summary: Read the researcher enrollment form
      description: Researcher-only full enrollment editor, including optional decrypted contacts, drop-out
        reason, baseline lock state and exact record version. Other roles, including separately granted
        IT, cannot access this endpoint.
      tags:
      - Enrollment
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentEditorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: Storage unavailable; SQL, request payload and bindings are not disclosed or logged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - name: participant
        in: path
        required: true
        description: Opaque participant UUID; researcher enrollment policy required.
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateResearchEnrollment
      summary: Update enrollment, baseline or status
      description: Researcher-only atomic update with parent row locking and an exact optimistic version
        check. Immutable study group/code; baseline/discharge date freeze once research history exists.
        No historical record is changed or removed. Events contain fixed action/outcome codes and staff
        actor only.
      tags:
      - Enrollment
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentEditorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: Storage unavailable; SQL, request payload and bindings are not disclosed or logged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/InvalidRequest'
        '409':
          description: The record changed since it was loaded; reload rather than overwriting.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollmentUpdate'
      parameters:
      - name: participant
        in: path
        required: true
        description: Opaque participant UUID; researcher enrollment policy required.
        schema:
          type: string
          format: uuid
  /api/v1/patient/assessments/status:
    get:
      operationId: patientAssessmentStatus
      summary: Get own daily assessment eligibility and approved questionnaire
      description: Patient principal only. Identity is derived from Sanctum. Returns unavailable with
        null questionnaire if approved effective definition is missing, malformed, ambiguous or unsupported.
        Does not seed instruments. All assessment routes share 30 requests/minute per principal. Responses
        are non-cacheable.
      tags:
      - Assessments
      security: *id001
      responses:
        '200':
          description: Current server WIB snapshot and immutable receipt if already submitted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentStatus'
        '401': &id002
          $ref: '#/components/responses/Unauthorized'
        '403': &id003
          $ref: '#/components/responses/Forbidden'
        '429': &id004
          $ref: '#/components/responses/TooManyAttempts'
  /api/v1/patient/assessments:
    get:
      operationId: patientAssessmentHistory
      summary: Read own immutable assessment history
      description: Patient principal only, including legacy records with null version. No patient ID accepted.
        Latest date first, 25 per page, no clinical computation.
      tags:
      - Assessments
      security: *id001
      responses:
        '200':
          description: Own history.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentHistory'
        '401': *id002
        '403': *id003
        '429': *id004
      parameters:
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
    post:
      operationId: submitPatientAssessment
      summary: Submit an approved daily assessment
      description: Patient principal only. Server derives identity, group, day zero and receipt time.
        First submission must match current version, approved same-day WIB schedule and exact catalog
        answers. Participant then credential locks serialize against PR-10 reset/revocation; token is
        checked again inside transaction. Existing UUID plus identical canonical body returns original
        receipt before current-version/day checks (but after current authorization); changed body, foreign
        UUID, duplicate day or stale version returns 409. No classification, score, alert or messaging
        side effects. No plaintext credentials returned. Unknown identity fields are rejected.
      tags:
      - Assessments
      security: *id001
      responses:
        '201':
          description: Committed immutable assessment, replayed=false.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentReceipt'
        '200':
          description: Exact retry recovered original receipt, replayed=true; no extra submission audit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentReceipt'
        '409':
          description: Unavailable instrument, changed version/day, duplicate day or reused UUID with
            different body/owner. Reload status; do not replace an uncertain retry UUID automatically.
        '422':
          $ref: '#/components/responses/InvalidRequest'
        '503':
          description: Storage failed and transaction rolled back. Retry with the same UUID/body; no SQL
            or clinical values returned.
        '401': *id002
        '403': *id003
        '429': *id004
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssessmentSubmission'
  /api/v1/participants/{participant}/assessments:
    get:
      operationId: staffAssessmentHistory
      summary: Read participant assessment observations
      description: Existing staff-only monitoring policy and query scope. Blinded assessor combinations
        are denied. ADMIN_IT requires independent CLINICAL_READ; CONTACT/TECHNICAL are insufficient. Nurses
        need current participant assignment. Audits privileged access. No write endpoint or contact/clinical-result
        serialization.
      tags:
      - Assessments
      security: *id001
      responses:
        '200':
          description: Authorized read-only history.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentHistory'
        '422':
          description: Invalid date range or record type. Authorization is checked first.
        '404':
          description: Participant not found.
        '401': *id002
        '403': *id003
        '429': *id004
      parameters:
      - in: path
        name: participant
        required: true
        schema:
          type: string
          format: uuid
      - in: query
        name: from
        description: Inclusive earliest stored observation date in WIB; no late-submission authorization.
        schema:
          type: string
          format: date
      - in: query
        name: to
        description: Inclusive latest stored observation date in WIB, on or after from when both provided.
        schema:
          type: string
          format: date
      - in: query
        name: type
        description: Stored record type only; does not enable repeat submissions.
        schema:
          type: string
          enum: [HARIAN, ULANG]
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
components:
  schemas:
    CredentialRevision:
      type:
      - string
      - 'null'
      format: uuid
      description: Non-secret random credential version, independent of PIN/hash. Send the exact latest
        GET revision as expected_revision, including explicit null for no credential or a legacy row.
        Missing or malformed versions return 422; a stale version returns 409. Not an authentication token.
    CredentialMutationReceipt:
      type: object
      additionalProperties: false
      required:
      - message
      - data
      properties:
        message:
          type: string
        data:
          type: object
          additionalProperties: false
          required:
          - revision
          properties:
            revision:
              type: string
              format: uuid
              description: Committed credential revision. No plaintext or hash is returned.
    ReadyHealth:
      type: object
      additionalProperties: false
      required:
      - status
      - database
      properties:
        status:
          type: string
          const: ok
        database:
          type: string
          const: connected
    UnavailableHealth:
      type: object
      additionalProperties: false
      required:
      - status
      - database
      properties:
        status:
          type: string
          const: unavailable
        database:
          type: string
          const: disconnected
    Error:
      type: object
      additionalProperties: false
      required:
      - message
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    Message:
